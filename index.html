<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<title>ClipCut – Video Downloader &amp; Trimmer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#5d6672;--line:#d9dde3;--accent:#0b5fff;--accent-t:#fff;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--text:#eef1f5;--muted:#9aa4b2;--line:#2b323b;--accent:#5b92ff;--accent-t:#06101f;--err:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:12px 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 6px;font-size:.95rem}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px}.row>div{flex:1}
.field{margin-bottom:14px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-t);font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:8px}
button:disabled{opacity:.6;cursor:wait}
.meta{display:flex;gap:12px;align-items:center}
.meta img{width:112px;border-radius:8px;flex:none}
.meta b{display:block}.meta span{color:var(--muted);font-size:.9rem}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
#msg{min-height:1.4em;margin-top:10px;font-size:.95rem}
#msg.err{color:var(--err)}
.hide{display:none}
@media(max-width:380px){body{padding:14px}.card{padding:15px}.row{gap:8px}}
</style>
</head>
<body>
<main>
  <h1>ClipCut</h1>
  <p class="sub">Paste a video link. Download the full video or just the section you need.</p>

  <div class="card">
    <div class="field">
      <label for="url">Video URL</label>
      <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/..." autocomplete="url">
    </div>
    <button class="ghost" id="check" type="button" style="margin-top:0">Preview Video</button>
  </div>

  <div class="card hide" id="info">
    <div class="meta"><img id="thumb" alt="Video thumbnail"><div><b id="title"></b><span id="dur"></span></div></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field"><label for="start">Start Time</label><input id="start" inputmode="decimal" placeholder="5:00"></div>
      <div class="field"><label for="end">End Time</label><input id="end" inputmode="decimal" placeholder="6:00"></div>
    </div>
    <p class="hint" style="margin:-6px 0 14px">Leave both fields empty to download the full video. Format: minutes:seconds (e.g. 5:00) or hours:minutes:seconds.</p>
    <div class="field">
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="best">Best Available (HD / 4K, if available)</option>
        <option value="1080">1080p Full HD</option>
        <option value="720">720p HD</option>
        <option value="480">480p</option>
        <option value="audio">Audio Only (MP3)</option>
      </select>
    </div>
    <button id="go" type="button">Download</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const fmt = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

async function post(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) { let e = "Something went wrong."; try { e = (await r.json()).error || e; } catch {} throw new Error(e); }
  return r;
}

$("check").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return msg("Please paste a video link first.", true);
  $("check").disabled = true; msg("Loading video details...");
  try {
    const d = await (await post("/api/info", {url})).json();
    $("title").textContent = d.title || "";
    $("dur").textContent = d.duration ? "Duration: " + fmt(d.duration) : "";
    if (d.thumbnail) $("thumb").src = d.thumbnail;
    $("info").classList.remove("hide"); msg("");
  } catch (e) { msg(e.message, true); }
  $("check").disabled = false;
};

$("go").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return msg("Please paste a video link first.", true);
  $("go").disabled = true; msg("Preparing your download... Large videos may take a few minutes.");
  try {
    const r = await post("/api/download", {url, start:$("start").value, end:$("end").value, quality:$("quality").value});
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    const name = m ? decodeURIComponent(m[1]) : "video.mp4";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
    URL.revokeObjectURL(a.href); msg("Download complete.");
  } catch (e) { msg(e.message, true); }
  $("go").disabled = false;
};
</script>
</body>
</html>
